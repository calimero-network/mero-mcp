# This version ensures compatibility with most Docker Compose installations
version: '3.8'

services:
  # Main MCP server service 
  mero-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: mero-mcp:latest
    container_name: mero-mcp
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mero-net

  # Uncomment this block to run a development server
  # mero-mcp-dev:
  #   build: 
  #     context: .
  #     dockerfile: Dockerfile.dev
  #   image: mero-mcp:dev
  #   container_name: mero-mcp-dev
  #   command: npm run dev
  #   ports:
  #     - "3001:3000"
  #   environment:
  #     - NODE_ENV=development
  #     - PORT=3000
  #     - LOG_LEVEL=debug
  #   volumes:
  #     - .:/app
  #     - /app/node_modules
  #   networks:
  #     - mero-net

networks:
  mero-net:
    driver: bridge 