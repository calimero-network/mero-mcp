name: Dependency Check

on:
  schedule:
    - cron: '0 0 * * 1'  # Run every Monday at midnight
  # Unfiltered: a required check must report on every pull request.
  push:
  workflow_dispatch:  # Allow manual triggering

jobs:
  dependency-check:
    name: Check Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check for outdated dependencies
        run: npm outdated || true
      
      # Gate on what ships. The dev tree carries findings inside the npm CLI that
      # @semantic-release/npm vendors, which no bump can clear and no consumer runs.
      # One advisory is let through, by id, and nothing else: GHSA-848j-6mx2-7j84
      # (elliptic, low) has no fixed version. It arrives via mero-js →
      # @phala/dcap-qvl, which verifies a relay's TDX quote before mero-mcp seals
      # to it. Remove the exception once elliptic or dcap-qvl ships a fix.
      - name: Run npm audit
        run: |
          npm audit --omit=dev || true
          npm audit --omit=dev --json > audit.json || true
          jq -e '[.vulnerabilities[] | .via[] | objects | select(.url | endswith("GHSA-848j-6mx2-7j84") | not)] | length == 0' audit.json
      
      - name: Install npm-check-updates
        run: npm install -g npm-check-updates
      
      - name: Generate dependency update report
        run: |
          ncu > dependency-report.txt
      
      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependency-report.txt
          retention-days: 30 