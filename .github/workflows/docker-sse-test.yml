name: Docker SSE Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'scripts/docker-test.js'
      - 'scripts/docker-test.sh'
      - '.github/workflows/docker-sse-test.yml'

jobs:
  docker-test:
    name: Docker and SSE Testing
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install dependencies
        run: |
          npm ci
          npm install -g node-fetch@2 eventsource
      
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
        
      - name: Build and Start Docker container
        run: |
          docker compose build
          docker compose up -d
      
      - name: Wait for container to be ready
        run: |
          # Wait for up to 100 seconds for the container to be ready
          timeout=100
          elapsed=0
          
          echo "Waiting for container to start..."
          until docker compose ps | grep -q "mero-mcp"; do
            if [ $elapsed -ge $timeout ]; then
              echo "Container startup timed out"
              docker compose logs
              exit 1
            fi
            
            sleep 5
            elapsed=$((elapsed + 5))
            echo "Still waiting for container to start... ($elapsed/$timeout seconds)"
          done
          
          echo "Container started, waiting for health check..."
          until docker compose ps | grep -q "healthy" || [ $elapsed -ge $timeout ]; do
            sleep 5
            elapsed=$((elapsed + 5))
            echo "Waiting for container to be healthy... ($elapsed/$timeout seconds)"
          done
          
          if [ $elapsed -ge $timeout ]; then
            echo "Container health check timed out"
            docker compose ps
            docker compose logs
            exit 1
          fi
          
          echo "Container is healthy and ready for testing!"
      
      - name: Run Docker test
        run: |
          chmod +x ./scripts/docker-test.sh
          # Update the script to use docker compose
          sed -i 's/docker-compose/docker compose/g' ./scripts/docker-test.sh
          ./scripts/docker-test.sh
      
      - name: Display logs on failure
        if: ${{ failure() }}
        run: |
          docker compose ps
          docker compose logs
      
      - name: Clean up
        if: ${{ always() }}
        run: |
          docker compose down 