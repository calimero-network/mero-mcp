# Deploy Documentation to GitHub Pages
#
# IMPORTANT: Before this workflow can successfully deploy, you must enable GitHub Pages in your repository:
# 1. Go to your repository on GitHub
# 2. Click Settings
# 3. Navigate to Pages (under Code and automation)
# 4. Under "Build and deployment", select "GitHub Actions" as the source
#
# This workflow will then build and deploy the documentation automatically.

name: Deploy Documentation

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs-deploy.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      
      - name: Install Docsify CLI
        run: npm install -g docsify-cli
      
      - name: Setup Documentation
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          cp -r docs/* _site/
          cp README.md _site/
          cat > _site/index.html << EOL
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>Mero MCP Server Documentation</title>
            <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
            <meta name="description" content="Mero MCP Server Documentation">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
            <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
          </head>
          <body>
            <div id="app"></div>
            <script>
              window.\$docsify = {
                name: 'Mero MCP Server',
                repo: 'https://github.com/calimero-network/mero-mcp',
                loadSidebar: true,
                subMaxLevel: 3,
                auto2top: true,
                homepage: 'README.md',
                search: {
                  maxAge: 86400000,
                  paths: 'auto',
                  placeholder: 'Search',
                  noData: 'No Results!',
                  depth: 6
                }
              }
            </script>
            <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
            <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
            <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
            <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
            <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
          </body>
          </html>
          EOL
          
          cat > _site/_sidebar.md << EOL
          * [Home](/)
          * [MCP Protocol](MCP-PROTOCOL.md)
          EOL
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
          name: "mero-mcp-docs-pages"

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "mero-mcp-docs-pages" 