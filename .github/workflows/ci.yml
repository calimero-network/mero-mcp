name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  # Installs the packed tarball and starts it by bin name, which is the only way
  # to exercise the symlink npm creates. Matrixed because the entrypoint is
  # resolved by node itself, so it can break on a runtime the other jobs never use.
  bin:
    name: Bin smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start the installed package by bin name
        run: node scripts/bin-smoke.mjs

  e2e:
    name: E2E (vs released merod)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --limit 1 includes pre-releases on purpose: core publishes only release
      # candidates, so GitHub resolves no "latest" and the newest tag is what ships.
      - name: Download released merod
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          TAG=$(gh release list --repo calimero-network/core --limit 1 --json tagName --jq '.[0].tagName')
          echo "Latest core release: $TAG"
          curl -fsSL "https://github.com/calimero-network/core/releases/download/$TAG/merod_x86_64-unknown-linux-gnu.tar.gz" | tar xz
          chmod +x ./merod

      # Both scripts boot their own merod on 2571, provision it from the committed
      # fixtures, and tear it down in a finally - identical to how they run locally,
      # so there is nothing CI-only here to drift.
      - name: Protocol e2e
        env:
          MEROD_BINARY: ${{ github.workspace }}/merod
          NO_COLOR: '1'
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee e2e.log
          # An all-skipped or no-op run must never read as green.
          grep -qE "[1-9][0-9]* passed, 0 failed, 0 skipped" e2e.log \
            || { echo "::error::e2e did not report a full pass - refusing a vacuous green"; exit 1; }

      - name: Full-cycle e2e
        env:
          MEROD_BINARY: ${{ github.workspace }}/merod
          NO_COLOR: '1'
        run: |
          set -o pipefail
          npm run e2e:cycle 2>&1 | tee e2e-cycle.log
          grep -qE "[1-9][0-9]* passed, 0 failed, 0 skipped" e2e-cycle.log \
            || { echo "::error::e2e:cycle did not report a full pass - refusing a vacuous green"; exit 1; }

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e.log
            e2e-cycle.log
            merod-e2e.log
            merod-cycle.log
          if-no-files-found: warn

      - name: Stop any surviving node
        if: always()
        run: pkill -f 'merod .*mcp-e2e' || true
