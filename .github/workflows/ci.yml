name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (vs merod built from core master)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Built from master rather than downloaded: no release carries
      # GET /admin-api/applications/:id/abi yet (0.11.0-rc.18 predates the merge),
      # and that endpoint is what every derived tool comes from. Switch to the
      # released-binary path (mero-js's CI has one to copy) once a core release
      # >= the first tag containing that route exists.
      - name: Checkout core
        uses: actions/checkout@v4
        with:
          repository: calimero-network/core
          ref: master
          path: core

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev

      # core/rust-toolchain.toml pins the channel; rustup honours it inside core/.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build merod
        env:
          # Raises the anonymous rate limit on the admin-dashboard asset core's build.rs fetches.
          CALIMERO_WEBUI_FETCH_TOKEN: ${{ github.token }}
          CALIMERO_AUTH_FRONTEND_FETCH_TOKEN: ${{ github.token }}
        run: cargo build -p merod --manifest-path core/Cargo.toml

      # Both scripts boot their own merod on 2571, provision it from the committed
      # fixtures, and tear it down in a finally - identical to how they run locally,
      # so there is nothing CI-only here to drift.
      - name: Protocol e2e
        env:
          MEROD_BINARY: ${{ github.workspace }}/core/target/debug/merod
          NO_COLOR: '1'
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee e2e.log
          # An all-skipped or no-op run must never read as green.
          grep -qE "[1-9][0-9]* passed, 0 failed, 0 skipped" e2e.log \
            || { echo "::error::e2e did not report a full pass - refusing a vacuous green"; exit 1; }

      - name: Full-cycle e2e
        env:
          MEROD_BINARY: ${{ github.workspace }}/core/target/debug/merod
          NO_COLOR: '1'
        run: |
          set -o pipefail
          npm run e2e:cycle 2>&1 | tee e2e-cycle.log
          grep -qE "[1-9][0-9]* passed, 0 failed, 0 skipped" e2e-cycle.log \
            || { echo "::error::e2e:cycle did not report a full pass - refusing a vacuous green"; exit 1; }

      - name: Upload e2e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e.log
            e2e-cycle.log
            merod-e2e.log
            merod-cycle.log
          if-no-files-found: warn

      - name: Stop any surviving node
        if: always()
        run: pkill -f 'merod .*mcp-e2e' || true
